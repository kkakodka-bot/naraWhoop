name: Persistent sync integrity subset

on:
  pull_request:
    branches: [main]
    paths:
      - 'Strand/**'
      - 'StrandiOS/**'
      - 'StrandTests/**'
      - 'Packages/**'
      - 'Tests/PersistentSyncNative/**'
      - 'Tests/BLETransportNative/**'
      - 'Tests/SyncPresentationNative/**'
      - 'Tools/SyncAcceptance/**'
      - 'Tests/CloudUploadNative/**'
      - 'Tests/HistoricalChunkNative/**'
      - 'Tests/ImuSessionNative/**'
      - 'Tests/ServerScoreReadbackNative/**'
      - '.github/workflows/persistent-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-integrity:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      NOOP_HERMETIC_TESTING: '1'
      NOOP_TEST_DISABLE_BLUETOOTH: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Tooling
        run: brew install xcodegen zstd
      - name: Candidate identity
        run: |
          git rev-parse HEAD
          xcodebuild -version
      - name: Manifest privacy guard
        run: python3 -m unittest discover -s Tools/SyncAcceptance -v
      - name: Native lifecycle and cloud outcomes
        run: |
          zsh Tests/PersistentSyncNative/run.sh "$RUNNER_TEMP/persistent-native"
          zsh Tests/BLETransportNative/run.sh "$RUNNER_TEMP/ble-transport-native"
          zsh Tests/SyncPresentationNative/run.sh "$RUNNER_TEMP"
          zsh Tests/CloudUploadNative/run.sh "$RUNNER_TEMP"
      - name: Store and push packages
        run: |
          swift test --package-path Packages/WhoopStore --scratch-path "$RUNNER_TEMP/store-build"
          swift test --package-path Packages/NoopPush --scratch-path "$RUNNER_TEMP/push-build"
          swift test --package-path Packages/StrandDesign --scratch-path "$RUNNER_TEMP/design-build"
      - name: Cached cloud readback and request admission
        run: |
          readbackStoreBuild=$(swift build --package-path Packages/WhoopStore --scratch-path "$RUNNER_TEMP/store-build" --show-bin-path)
          readbackPushBuild=$(swift build --package-path Packages/NoopPush --scratch-path "$RUNNER_TEMP/push-build" --show-bin-path)
          zsh Tests/ServerScoreReadbackNative/run.sh "$readbackStoreBuild" "$readbackPushBuild" "$RUNNER_TEMP/readback-tests"
          zsh Tests/ImuSessionNative/run.sh "$readbackStoreBuild" "$readbackPushBuild" "$RUNNER_TEMP"
      - name: Process-death, SQLite-full and 10000 chunk replay
        run: zsh Tests/HistoricalChunkNative/run.sh "$RUNNER_TEMP" 10000
      - name: Hosted integration subset
        run: |
          xcodegen generate
          xcodebuild test -project Strand.xcodeproj -scheme Strand -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/hosted-build" \
            -resultBundlePath "$RUNNER_TEMP/hosted.xcresult" CODE_SIGN_IDENTITY=- \
            -only-testing:StrandTests/RealtimeWearPolicyTests \
            -only-testing:StrandTests/RealtimeIntentControllerTests \
            -only-testing:StrandTests/BLEConnectionOwnerTests \
            -only-testing:StrandTests/BLEConnectionSetupLeaseTests \
            -only-testing:StrandTests/BLETransportDriverTests \
            -only-testing:StrandTests/BLENotificationControllerTests \
            -only-testing:StrandTests/CloudPushPreparedSelectionTests \
            -only-testing:StrandTests/CloudUploadQueueTests \
            -only-testing:StrandTests/CloudUploadOutcomeTests \
            -only-testing:StrandTests/CloudMetadataMigrationTests \
            -only-testing:StrandTests/CloudPushReceiptIntegrationTests \
            -only-testing:StrandTests/CloudAuxiliaryIdentityTests \
            -only-testing:StrandTests/CollectorImuRepairTests \
            -only-testing:StrandTests/ScoringPreferenceRecomputeTests \
            -only-testing:StrandTests/HistoricalCommitLeaseTests \
            -only-testing:StrandTests/ResourceBudgetTests \
            -only-testing:StrandTests/SyncPresentationTests \
            -only-testing:StrandTests/BackfillManagerLifecycleTests \
            -only-testing:StrandTests/BackfillActorPipelineTests \
            -only-testing:StrandTests/CaptureCloudStressTests \
            -only-testing:StrandTests/BackfillerPersistCircuitBreakerTests \
            -only-testing:StrandTests/BackfillerHistoricalProgressTests \
            -only-testing:StrandTests/BackfillerImuSessionTests \
            -only-testing:StrandTests/ImuSessionFileStoreTests \
            -only-testing:StrandTests/BackfillContinuationTests \
            -only-testing:StrandTests/BackfillerCriticalPathTests \
            -only-testing:StrandTests/BackfillerSessionTallyTests \
            -only-testing:StrandTests/RepositoryServerScoresTests \
            -only-testing:StrandTests/ServerScoreContextAppTests \
            -only-testing:StrandTests/ServerScoreSleepModelTests \
            -only-testing:StrandTests/DisplayPerformanceTests
      - name: Unsigned iOS Release build
        run: |
          xcodebuild build -project Strand.xcodeproj -scheme NOOPiOS -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ios-release" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Sanitized candidate manifest
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/hosted.xcresult" ]; then
            python3 Tools/SyncAcceptance/manifest.py --output "$RUNNER_TEMP/candidate-manifest.json" --xcresult "$RUNNER_TEMP/hosted.xcresult"
          else
            python3 Tools/SyncAcceptance/manifest.py --output "$RUNNER_TEMP/candidate-manifest.json"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persistent-sync-candidate-manifest
          path: ${{ runner.temp }}/candidate-manifest.json
          if-no-files-found: error
      - name: Acceptance boundary
        run: echo 'This is a local integrity subset. Physical, deployed-server and performance gates remain NOT_MEASURED; release remains NOT_READY.'
