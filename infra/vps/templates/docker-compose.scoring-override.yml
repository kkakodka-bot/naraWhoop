# Merge into /opt/frwhoop/supabase-docker/docker/docker-compose.yml on the VPS.
# Requires secrets: DATABASE_URL (pooler), INGEST_SECRET, SUPABASE_URL, SERVICE_ROLE_KEY, WORKER_SECRET.
services:
  scoring:
    image: frwhoop/scoring-service:latest
    build:
      context: ../../..
      dockerfile: scoring-service/Dockerfile
    restart: unless-stopped
    depends_on:
      - db
      - rest
    env_file:
      - /opt/frwhoop/b2.env
    environment:
      DATABASE_URL: ${SCORING_DATABASE_URL}
      INGEST_SECRET: ${INGEST_SECRET}
      SUPABASE_URL: http://rest:3000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      WORKER_SECRET: ${WORKER_SECRET}
      SCORING_POLL_SECONDS: ${SCORING_POLL_SECONDS:-8}
      SCORING_ALGORITHM_VERSION: frwhoop-server-1
      B2_BUCKET: ${B2_BUCKET_NAME:-FRWHOOP}
      DERIVED_RETENTION_DAYS: ${DERIVED_RETENTION_DAYS:-90}
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f /app/bin/service || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
